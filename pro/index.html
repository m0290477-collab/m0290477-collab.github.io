<div id="m-confirm" class="modal x-hide" role="dialog" aria-modal="true"><div class="glass mcard"><p id="cf-text"></p>
  <div class="r-btns"><button class="btn ghost" id="cf-no" data-i="no"></button><button class="btn danger" id="cf-yes" data-i="yes"></button></div></div></div>

<div id="m-reveal" class="x-hide" role="dialog" aria-modal="true"><div class="rv-rays"></div><div class="rv-card" id="rv-card"><div class="rv-rar" id="rv-rar"></div><div class="rv-name" id="rv-name"></div><div class="rv-sub" id="rv-sub"></div></div>
  <div class="rv-btns"><button class="btn ghost" id="rv-close" data-i="continue"></button><button class="btn gold" id="rv-equip" data-i="equip"></button></div></div>

<div id="m-login" class="modal x-hide" role="dialog" aria-modal="true"><div class="glass mcard lgc"><button class="icon-btn mclose" data-close data-ia="back"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <h2 data-i="loginTitle"></h2><p class="fine" data-i="loginSub"></p><div class="cal" id="lg-days"></div><button class="btn gold wide" id="lg-claim"></button></div></div>

<div id="m-spin" class="modal x-hide" role="dialog" aria-modal="true"><div class="glass mcard spc"><button class="icon-btn mclose" data-close data-ia="back"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="sp-wrap"><div class="wheel" id="sp-wheel"></div><i class="sp-pin"></i><b class="sp-hub">✦</b></div>
  <div class="sp-side"><h2 data-i="spinTitle"></h2><p class="fine" data-i="spinSub"></p><p class="sp-res" id="sp-res"></p><button class="btn gold wide" id="sp-go"></button></div></div></div>

<div id="wipe" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="js/main.js?v=play2"></script>
</body>
</html>
